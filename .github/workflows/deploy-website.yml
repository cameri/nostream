name: Deploy Website

# The marketing site deploys when a nostream-website release is published:
# the changesets release PR bumps the site package, and merging that PR makes
# the changesets workflow tag + publish nostream-website@X.Y.Z and create the
# GitHub release — this workflow deploys that tagged build. Merges to main do
# not deploy; version the site with a changeset and merge the release PR.

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ startsWith(github.event.release.tag_name, 'nostream-website@') ||
      github.event_name == 'workflow_dispatch' }}
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    # Deploy credentials live in this GitHub environment: CLOUDFLARE_API_TOKEN
    # secret (Workers Scripts scope) and CLOUDFLARE_ACCOUNT_ID variable.
    environment: website
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        working-directory: website/site
        env:
          SITE_URL: https://ema.tnsor.network
        run: pnpm run build

      - name: Deploy to Cloudflare Workers
        working-directory: website/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
