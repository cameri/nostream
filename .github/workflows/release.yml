name: Release

on:
  release:
    types: [published]

jobs:
  build-and-push-image:
    # Changesets tags each workspace package on publish: relay releases tag
    # vX.Y.Z, website releases tag nostream-website@X.Y.Z. Only a relay tag
    # should build the relay container image.
    if: startsWith(github.event.release.tag_name, 'v')
    name: Build and push container image
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Stated rather than inherited from the action's defaults: the deploy
          # path pulls `:latest`, so a released image must carry it. The action's
          # default already emits `<version>` and `latest` for a release whose
          # tag is vX.Y.Z, but that is a default and not a contract - naming it
          # here is what makes `latest` something this repository promises.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
