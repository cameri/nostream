[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/cameri/nostream"

[workspace.dependencies]
aes = "0.8"
anyhow = "1"
axum = "0.8"
base64 = "0.22.1"
bech32 = "0.11"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chacha20 = "0.10.2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-core = "0.3"
futures-util = "0.3"
getrandom = "0.3"
heed = { version = "0.20", features = ["read-txn-no-tls"] }
hex = "0.4.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
hkdf = "0.13.0"
hmac = "0.13.0"
negentropy = "0.5.2"
nostream-admin = { path = "crates/nostream-admin" }
nostream-cli = { path = "crates/nostream-cli" }
nostream-config = { path = "crates/nostream-config" }
nostream-core = { path = "crates/nostream-core" }
nostream-mcp = { path = "crates/nostream-mcp" }
nostream-relay = { path = "crates/nostream-relay" }
nostream-services = { path = "crates/nostream-services" }
nostream-storage = { path = "crates/nostream-storage" }
nostreamd = { path = "crates/nostreamd" }
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "rt-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.11", features = ["server", "transport-io", "transport-async-rw"] }
scrypt = "0.11"
secp256k1 = "0.33.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "json", "tls-rustls-ring-webpki"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
xz2 = "0.1"

# Nothing reads debug info here. The 66 integration-test binaries this workspace links are
# 81% DWARF — one measured 236 MB unstripped against 45 MB stripped, and `.debug_str` alone
# was 75 MB of what line-tables-only still wrote — and every consumer in this repository
# (`cargo test`, `clippy`, `fmt`, the factory's lenses, CI) either never opens it or prints a
# panic location, which the compiler emits with or without it (`#[track_caller]`).
# `cargo test` runs the `test` profile, so this is the profile that decides the size of every
# artifact a test run leaves behind.
#
# Measured 2026-11-21 on `-p nostream-mcp --test auth` from a cold target dir:
#
#   profile            binary   build   target dir
#   dev (default, 2)   230 MB    75 s      1.6 GB
#   line tables (1)    150 MB    54 s      1.3 GB
#   none (0)            43 MB    49 s      0.8 GB
#
# `dev` deliberately keeps the default: `cargo build` artifacts are for a debugger to open by
# hand, and that is the one case where the bytes are read. Everything automated uses `test`.
[profile.test]
debug = 0

[workspace.lints.rust]
# `deny` rather than `forbid`: heed's LMDB `EnvOpenOptions::open` is an `unsafe fn`
# (heed 0.20.5, src/env.rs:236) and the storage crate wraps it in exactly one
# audited `#[allow(unsafe_code)]` call. Every other crate is effect-free unsafe.
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Carried here as well as on the strict `--lib --bins` command line in CI. Without them
# a crate that inherits `[lints] workspace = true` passes a local `cargo clippy` and is
# then rejected by the gate, which is the one thing a lint configuration must never do.
# Tests still opt out per crate with `#![allow(clippy::unwrap_used, clippy::expect_used)]`
# in the test target, which is narrower than a command-line flag: it names the files that
# may unwrap instead of exempting every target in the workspace.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
