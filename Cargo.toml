[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/cameri/nostream"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
heed = "0.20"
nostream-admin = { path = "crates/nostream-admin" }
nostream-cli = { path = "crates/nostream-cli" }
nostream-config = { path = "crates/nostream-config" }
nostream-core = { path = "crates/nostream-core" }
nostream-relay = { path = "crates/nostream-relay" }
nostream-services = { path = "crates/nostream-services" }
nostream-storage = { path = "crates/nostream-storage" }
nostreamd = { path = "crates/nostreamd" }
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "rt-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[workspace.lints.rust]
# `deny` rather than `forbid`: heed's LMDB `EnvOpenOptions::open` is an `unsafe fn`
# (heed 0.20.5, src/env.rs:236) and the storage crate wraps it in exactly one
# audited `#[allow(unsafe_code)]` call. Every other crate is effect-free unsafe.
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Carried here as well as on the strict `--lib --bins` command line in CI. Without them
# a crate that inherits `[lints] workspace = true` passes a local `cargo clippy` and is
# then rejected by the gate, which is the one thing a lint configuration must never do.
# Tests still opt out per crate with `#![allow(clippy::unwrap_used, clippy::expect_used)]`
# in the test target, which is narrower than a command-line flag: it names the files that
# may unwrap instead of exempting every target in the workspace.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
