[package]
name = "nostream-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Repository traits, backend selection and the Postgres and LMDB storage backends"

[features]
# Both backends are on by default: Postgres is the reference implementation and the LMDB
# backend is what the rewrite exists to provide. A build that only needs the trait seam
# turns both off and links no driver at all.
default = ["postgres", "lmdb"]
postgres = ["dep:sqlx"]
# The LMDB backend, its environment and its row encodings. `uuid` is only used to mint
# the canonical text ids the outbox and delivery-log columns generate.
lmdb = ["dep:heed", "dep:uuid", "dep:tracing"]

[dependencies]
chrono.workspace = true
futures-core.workspace = true
heed = { workspace = true, optional = true }
nostream-config.workspace = true
nostream-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
clap.workspace = true
serde_yaml.workspace = true
tempfile.workspace = true

# The benchmark rig (`docs/rewrite/benchmarks.md`). Both features are required: the harness holds
# either backend behind one `EventRepository`, so a build that turns one off has nothing to
# measure. The requirement is also what keeps CI's `--no-default-features --all-targets` check
# from compiling it.
[[example]]
name = "bench"
required-features = ["lmdb", "postgres"]

[lints]
workspace = true
